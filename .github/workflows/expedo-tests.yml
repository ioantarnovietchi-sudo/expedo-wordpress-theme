name: EXPEDO comparison and theme tests

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  wordpress-woocommerce-comparison:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, curl, mbstring, zip, xml
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PHP syntax check
        run: |
          find . -path ./.git -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check assets/js/theme.js

      - name: Install WordPress and WooCommerce
        env:
          DB_HOST: 127.0.0.1:3306
        run: |
          set -e
          curl -sSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          php wp-cli.phar core download --path=wp --allow-root
          php wp-cli.phar config create --path=wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost="$DB_HOST" --allow-root
          php wp-cli.phar core install --path=wp --url=http://127.0.0.1:8080 --title="EXPEDO Test" --admin_user=admin --admin_password=testing123 --admin_email=test@example.com --skip-email --allow-root
          mkdir -p wp/wp-content/themes/expedo
          tar --exclude='./.git' --exclude='./wp' --exclude='./wp-cli.phar' -cf - . | tar -xf - -C wp/wp-content/themes/expedo
          php wp-cli.phar plugin install woocommerce --activate --path=wp --allow-root
          php wp-cli.phar theme activate expedo --path=wp --allow-root
          php wp-cli.phar rewrite structure '/%postname%/' --path=wp --allow-root
          php wp-cli.phar rewrite flush --path=wp --allow-root

      - name: Create comparison fixtures
        run: |
          cat > /tmp/create-fixtures.php <<'PHP'
          <?php
          $page = get_page_by_path('compara-produse');
          if (!$page) {
            wp_insert_post([
              'post_type' => 'page',
              'post_status' => 'publish',
              'post_title' => 'Compară produse',
              'post_name' => 'compara-produse'
            ]);
          }
          $ids = [];
          foreach (['Produs Test A', 'Produs Test B'] as $name) {
            $product = new WC_Product_Simple();
            $product->set_name($name);
            $product->set_status('publish');
            $product->set_regular_price('100');
            $product->set_catalog_visibility('visible');
            $ids[] = $product->save();
          }
          file_put_contents('/tmp/expedo-product-ids.txt', implode(',', $ids));
          PHP
          php wp-cli.phar eval-file /tmp/create-fixtures.php --path=wp --allow-root

      - name: Start WordPress server
        run: |
          php -S 127.0.0.1:8080 -t wp > /tmp/expedo-wp.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/expedo-wp.log
          exit 1

      - name: Test comparison AJAX endpoint
        run: |
          set -e
          IFS=',' read -r FIRST SECOND < /tmp/expedo-product-ids.txt
          echo "Fixture product IDs: $FIRST,$SECOND"
          php wp-cli.phar eval 'foreach ([$argv[0],$argv[1]] as $id) { $p=wc_get_product((int)$id); echo "Product ".$id.": ".($p ? $p->get_name()." / status=".$p->get_status()." / visibility=".$p->get_catalog_visibility()." / visible=".($p->is_visible()?"yes":"no") : "NOT FOUND").PHP_EOL; }' "$FIRST" "$SECOND" --path=wp --allow-root
          HTTP_CODE="$(curl -sS -o /tmp/expedo-ajax-response.txt -w '%{http_code}' -X POST http://127.0.0.1:8080/wp-admin/admin-ajax.php \
            --data-urlencode action=expedo_compare_data \
            --data-urlencode "ids[]=$FIRST" \
            --data-urlencode "ids[]=$SECOND")"
          RESPONSE="$(cat /tmp/expedo-ajax-response.txt)"
          echo "AJAX HTTP status: $HTTP_CODE"
          echo "AJAX response body: $RESPONSE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "WordPress server log:"
            cat /tmp/expedo-wp.log
            exit 1
          fi
          node -e 'const raw=process.argv[1]; let r; try { r=JSON.parse(raw); } catch(e) { console.error("AJAX did not return JSON"); process.exit(1); } if(!r.success || !Array.isArray(r.data) || r.data.length!==2) { console.error("Unexpected AJAX payload:",r); process.exit(1); } const names=r.data.map(p=>p.name); if(!names.includes("Produs Test A") || !names.includes("Produs Test B")) { console.error("Unexpected product names:",names); process.exit(1); } console.log("PASS: 2 produse returnate corect fără nonce.")' "$RESPONSE"

      - name: Test comparison page rendering
        run: |
          PAGE="$(curl -fsS http://127.0.0.1:8080/compara-produse/)"
          echo "$PAGE" | grep -q 'expedo-compare-results'
          echo "PASS: pagina de comparație conține containerul necesar."
