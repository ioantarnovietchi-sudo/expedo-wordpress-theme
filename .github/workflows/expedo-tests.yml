name: EXPEDO comparison and theme tests

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  wordpress-woocommerce-comparison:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, curl, mbstring, zip, xml
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: PHP syntax check
        run: |
          find . -path ./.git -prune -o -name '*.php' -type f -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check assets/js/theme.js

      - name: Install WordPress and WooCommerce
        env:
          DB_HOST: 127.0.0.1:3306
        run: |
          set -e
          curl -sSLo wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          php wp-cli.phar core download --path=wp --allow-root
          php wp-cli.phar config create --path=wp --dbname=wordpress --dbuser=root --dbpass=root --dbhost="$DB_HOST" --allow-root
          php wp-cli.phar core install --path=wp --url=http://127.0.0.1:8080 --title="EXPEDO Test" --admin_user=admin --admin_password=testing123 --admin_email=test@example.com --skip-email --allow-root
          mkdir -p wp/wp-content/themes/expedo
          tar --exclude='./.git' --exclude='./wp' --exclude='./wp-cli.phar' -cf - . | tar -xf - -C wp/wp-content/themes/expedo
          php wp-cli.phar plugin install woocommerce --activate --path=wp --allow-root
          php wp-cli.phar theme activate expedo --path=wp --allow-root
          php wp-cli.phar rewrite structure '/%postname%/' --path=wp --allow-root
          php wp-cli.phar rewrite flush --path=wp --allow-root

      - name: Create comparison fixtures
        run: |
          cat > /tmp/create-fixtures.php <<'PHP'
          <?php
          $page = get_page_by_path('compara-produse');
          if (!$page) {
            wp_insert_post([
              'post_type' => 'page',
              'post_status' => 'publish',
              'post_title' => 'Compară produse',
              'post_name' => 'compara-produse'
            ]);
          }
          $ids = [];
          foreach (['Produs Test A', 'Produs Test B'] as $name) {
            $product = new WC_Product_Simple();
            $product->set_name($name);
            $product->set_status('publish');
            $product->set_regular_price('100');
            $product->set_catalog_visibility('visible');
            $ids[] = $product->save();
          }
          file_put_contents('/tmp/expedo-product-ids.txt', implode(',', $ids));
          PHP
          php wp-cli.phar eval-file /tmp/create-fixtures.php --path=wp --allow-root

      - name: Test comparison AJAX endpoint and page
        run: |
          set -e
          cat > /tmp/test-comparison.php <<'PHP'
          <?php
          $ids = array_map('intval', explode(',', trim(file_get_contents('/tmp/expedo-product-ids.txt'))));
          if (count($ids) !== 2) { fwrite(STDERR, "Expected two fixture products.\n"); exit(1); }
          foreach ($ids as $id) {
            $product = wc_get_product($id);
            if (!$product || !$product->is_visible()) { fwrite(STDERR, "Fixture product {$id} is missing or invisible.\n"); exit(1); }
          }
          $_POST['ids'] = $ids;
          add_filter('wp_die_handler', function () {
            return function ($message = '') { throw new RuntimeException('WP_DIE'); };
          });
          ob_start();
          try { expedo_compare_data(); } catch (RuntimeException $e) {
            if ($e->getMessage() !== 'WP_DIE') throw $e;
          }
          $raw = ob_get_clean();
          $response = json_decode($raw, true);
          if (!is_array($response) || empty($response['success']) || count($response['data'] ?? []) !== 2) {
            fwrite(STDERR, "Unexpected AJAX response: {$raw}\n"); exit(1);
          }
          $names = array_column($response['data'], 'name');
          if (!in_array('Produs Test A', $names, true) || !in_array('Produs Test B', $names, true)) {
            fwrite(STDERR, "Unexpected products returned: " . implode(', ', $names) . "\n"); exit(1);
          }
          echo "PASS: AJAX endpoint returns both visible products without a nonce.\n";
          $page = get_page_by_path('compara-produse', OBJECT, 'page');
          if (!$page || $page->post_status !== 'publish') { fwrite(STDERR, "Comparison page is missing or unpublished.\n"); exit(1); }
          $template = locate_template('templates/page-compare.php');
          if (!$template) { fwrite(STDERR, "Comparison page template is missing.\n"); exit(1); }
          $template_source = file_get_contents($template);
          if (strpos($template_source, 'expedo-compare-results') === false) { fwrite(STDERR, "Comparison results container is missing from template.\n"); exit(1); }
          echo "PASS: published comparison page and results container exist.\n";
          PHP
          php wp-cli.phar eval-file /tmp/test-comparison.php --path=wp --allow-root

      - name: Start WordPress test server
        run: |
          cat > /tmp/expedo-wp-router.php <<'PHP'
          <?php
          $root = getenv('EXPEDO_WP_ROOT');
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $file = realpath($root . $path);
          if ($path !== '/' && $file && str_starts_with($file, realpath($root)) && is_file($file)) {
            return false;
          }
          require $root . '/index.php';
          PHP
          EXPEDO_WP_ROOT="$GITHUB_WORKSPACE/wp" php -S 127.0.0.1:8080 -t "$GITHUB_WORKSPACE/wp" /tmp/expedo-wp-router.php > /tmp/expedo-php-server.log 2>&1 &
          echo $! > /tmp/expedo-php-server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              echo "PASS: WordPress test server is responding."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/expedo-php-server.log
          echo "WordPress test server did not start." >&2
          exit 1

      - name: Test comparison AJAX over HTTP
        run: |
          set -e
          IFS=, read -r ID_A ID_B < /tmp/expedo-product-ids.txt
          HTTP_STATUS="$(curl -sS -o /tmp/expedo-valid-ajax.json -w '%{http_code}' -X POST \
            --data-urlencode 'action=expedo_compare_data' \
            --data-urlencode "ids[]=$ID_A" \
            --data-urlencode "ids[]=$ID_B" \
            http://127.0.0.1:8080/wp-admin/admin-ajax.php)"
          echo "Valid AJAX HTTP status: $HTTP_STATUS"
          cat /tmp/expedo-valid-ajax.json
          test "$HTTP_STATUS" = "200"
          cat /tmp/expedo-valid-ajax.json | php -r '
            $data = json_decode(stream_get_contents(STDIN), true);
            if (!is_array($data) || empty($data["success"]) || count($data["data"] ?? []) !== 2) {
              fwrite(STDERR, "Unexpected HTTP AJAX response.\\n");
              exit(1);
            }
            $names = array_column($data["data"], "name");
            if (!in_array("Produs Test A", $names, true) || !in_array("Produs Test B", $names, true)) {
              fwrite(STDERR, "HTTP AJAX response contains unexpected products.\\n");
              exit(1);
            }
            echo "PASS: real HTTP AJAX request returns both products.\\n";
          '
          STATUS="$(curl -sS -o /tmp/expedo-invalid-ajax.json -w '%{http_code}' -X POST \
            --data-urlencode 'action=expedo_compare_data' \
            http://127.0.0.1:8080/wp-admin/admin-ajax.php)"
          echo "Invalid AJAX HTTP status: $STATUS"
          test "$STATUS" -ge 400
          php -r '
            $data = json_decode(file_get_contents("/tmp/expedo-invalid-ajax.json"), true);
            if (!is_array($data) || !empty($data["success"])) {
              fwrite(STDERR, "Empty AJAX request was not rejected.\\n");
              exit(1);
            }
            echo "PASS: empty HTTP AJAX request is rejected with a JSON error and an HTTP error status.\\n";
          '

      - name: Test comparison page rendering
        run: |
          PAGE="$(curl -fsS http://127.0.0.1:8080/compara-produse/)"
          echo "$PAGE" | grep -q 'expedo-compare-results'
          echo "PASS: pagina de comparație conține containerul necesar."

      - name: Package theme ZIP
        if: success()
        run: |
          set -e
          mkdir -p dist package
          while IFS= read -r -d '' file; do
            case "$file" in
              *.zip|.github/*) continue ;;
            esac
            mkdir -p "package/$(dirname "$file")"
            cp "$file" "package/$file"
          done < <(git ls-files -z)
          test -f package/style.css
          test -f package/functions.php
          test -f package/assets/js/theme.js
          (cd package && zip -qr "$GITHUB_WORKSPACE/dist/expedo-theme-v1.21-comparison.zip" .)
          unzip -t dist/expedo-theme-v1.21-comparison.zip
          unzip -Z1 dist/expedo-theme-v1.21-comparison.zip | grep -q '^style.css$'
          unzip -Z1 dist/expedo-theme-v1.21-comparison.zip | grep -q '^functions.php$'
          unzip -Z1 dist/expedo-theme-v1.21-comparison.zip | grep -q '^assets/js/theme.js$'
          if unzip -Z1 dist/expedo-theme-v1.21-comparison.zip | grep -Eq '(^|/)[^/]+\.zip$'; then
            echo "Nested ZIP file found in theme package." >&2
            exit 1
          fi

      - name: Upload theme ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: expedo-theme-v1.21-comparison
          path: dist/expedo-theme-v1.21-comparison.zip
          if-no-files-found: error
